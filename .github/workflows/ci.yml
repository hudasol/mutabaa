name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests with coverage gate (90% of pipeline/)
        run: pytest --cov=pipeline --cov-report=term
      - name: Frozen regression test (existing score, status engine, sweep and results are unchanged)
        run: pytest tests/test_regression_frozen.py -q --no-cov
      - name: Preregistered evaluation reproduces the committed results
        run: |
          python -m pipeline evaluate
          git diff --exit-code -- results ':!results/env' docs/EVALUATION.md
      - name: Validate data
        run: python -m pipeline validate
      - name: Validate the Definition Card examples
        run: |
          for f in data/examples/definition_cards/*.json; do python -m pipeline definition validate "$f"; done
      - name: Traceability and risk register
        run: |
          python scripts/check_traceability.py
          python scripts/check_risks.py

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm audit --audit-level=high
      - run: npm run build:offline
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: SBOM
        run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
