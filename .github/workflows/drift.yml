name: source-drift
# Weekly check that the public source pages still show what the ledger relies on.
# It never edits a ledger record. It writes a dated report to monitoring/ and opens one tracking issue
# only when a page changed or has just become unreachable. No secrets are used; the token is the default one.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Compare the live pages with the recorded verification
        id: drift
        run: python -m pipeline monitor
      - name: Commit the dated report
        run: |
          git config user.name "Huda Mueen"
          git config user.email "hudamueen2407@gmail.com"
          git add monitoring
          git diff --cached --quiet || git commit -m "chore(monitoring): drift report for ${{ steps.drift.outputs.date }}"
          git push
      - name: Open the tracking issue once, or add to it
        if: steps.drift.outputs.attention == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.drift.outputs.date }}
        run: |
          existing=$(gh issue list --label source-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Drift report for $DATE: monitoring/drift-$DATE.md"
          else
            gh label create source-drift --description "A source page changed or became unreachable" 2>/dev/null || true
            gh issue create --label source-drift --title "Source pages changed or became unreachable" \
              --body "The weekly check found a change. Read monitoring/drift-$DATE.md. A person decides whether a ledger record needs a correction; the check changes none."
          fi
