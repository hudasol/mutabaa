[project]
name = "mutabaa"
version = "1.5.0"
description = "Verifiability workbench for UAE AI transformation targets"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Huda Mueen" }]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.5"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pipeline"]

[tool.coverage.report]
# The gate: `pytest --cov` fails below this share of covered lines in pipeline/.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
